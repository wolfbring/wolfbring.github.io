<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>課堂點名 1–60 旋轉數字輪盤</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
      color: #f9fafb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      margin-bottom: 4px;
    }

    .hint {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 12px;
      text-align: center;
    }

    .wheel-container {
      position: relative;
      width: 360px;
      height: 360px;
      margin-bottom: 16px;
    }

    .pointer {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-bottom: 22px solid #f97316;
      z-index: 10;
      filter: drop-shadow(0 0 4px rgba(0,0,0,0.6));
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #1e293b, #020617);
      border: 6px solid #0f172a;
      position: relative;
      overflow: hidden;
      transition: transform 4s cubic-bezier(0.17, 0.89, 0.24, 1.1);
      box-shadow:
        0 0 0 4px #111827,
        0 18px 35px rgba(0,0,0,0.6);
    }

    .segment {
      position: absolute;
      width: 50%;
      height: 2px;
      top: 50%;
      left: 50%;
      transform-origin: 0% 50%;
    }

    .segment-label {
      position: absolute;
      right: -18px;
      top: -10px;
      width: 32px;
      text-align: center;
      font-size: 11px;
      color: #e5e7eb;
      transform-origin: 50% 50%;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 4px;
    }

    button {
      padding: 8px 18px;
      border-radius: 999px;
      border: none;
      background: #3b82f6;
      color: #f9fafb;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #2563eb;
    }

    button:active {
      background: #1d4ed8;
      transform: translateY(1px);
    }

    button:disabled {
      background: #4b5563;
      cursor: default;
    }

    .round {
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 4px;
      min-height: 18px;
      text-align: center;
    }

    .result {
      min-height: 24px;
      font-size: 18px;
      margin-top: 2px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>課堂點名數字輪盤</h1>
  <div class="hint">點「旋轉」抽出座號，可改 COUNT 成實際人數。</div>

  <div class="wheel-container">
    <div class="pointer"></div>
    <div class="wheel" id="wheel"></div>
  </div>

  <div class="controls">
    <button id="spinBtn">旋轉</button>
    <button id="resetBtn">重置角度</button>
  </div>
  <div class="round" id="roundInfo"></div>
  <div class="result" id="result"></div>
