<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎰 課堂點名 1–74 豪華旋轉輪盤</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 20% 50%, #0a0a1f 0%, #020617 50%, #000 100%);
      color: #f9fafb;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .app {
      display: flex;
      gap: 40px;
      max-width: 1600px;
      width: 100%;
    }

    h1 {
      margin: 0 0 12px 0;
      font-size: clamp(2.5rem, 6vw, 4rem);
      background: linear-gradient(135deg, #fbbf24, #f59e0b, #ef4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 30px rgba(251, 191, 36, 0.5);
      animation: glowTitle 2s ease-in-out infinite alternate;
    }

    @keyframes glowTitle {
      0% { text-shadow: 0 0 20px rgba(251, 191, 36, 0.5); }
      100% { text-shadow: 0 0 40px rgba(251, 191, 36, 0.8), 0 0 60px rgba(245, 158, 11, 0.4); }
    }

    .hint {
      font-size: 1.1rem;
      opacity: 0.95;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.5;
      background: rgba(249, 250, 251, 0.1);
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid rgba(249, 250, 251, 0.2);
    }

    .wheel-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      position: relative;
    }

    /* 粒子背景 */
    .particles {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: radial-gradient(circle, rgba(251, 191, 36, 0.8), transparent);
      border-radius: 50%;
      animation: float 6s infinite linear;
    }

    @keyframes float {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100px) scale(1); opacity: 0; }
    }

    .wheel-container {
      position: relative;
      width: 450px;
      height: 450px;
      margin-bottom: 24px;
      z-index: 2;
    }

    .pointer {
      position: absolute;
      top: -25px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 22px solid transparent;
      border-right: 22px solid transparent;
      border-bottom: 35px solid #ff6b35;
      z-index: 15;
      filter: drop-shadow(0 0 12px #ff6b35) drop-shadow(0 0 24px rgba(255, 107, 53, 0.6));
      animation: pointerGlow 2s ease-in-out infinite alternate;
    }

    @keyframes pointerGlow {
      0% { filter: drop-shadow(0 0 12px #ff6b35) drop-shadow(0 0 24px rgba(255, 107, 53, 0.6)); }
      100% { filter: drop-shadow(0 0 18px #ff6b35) drop-shadow(0 0 36px rgba(255, 107, 53, 0.9)); }
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: all 5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      box-shadow: 
        0 0 0 12px rgba(15, 23, 42, 0.8),
        inset 0 0 60px rgba(0,0,0,0.7),
        0 30px 80px rgba(0,0,0,0.8),
        0 0 100px rgba(251, 191, 36, 0.1);
    }

    .wheel.spinning {
      box-shadow: 
        0 0 0 12px rgba(15, 23, 42, 0.8),
        inset 0 0 80px rgba(0,0,0,0.8),
        0 40px 120px rgba(0,0,0,0.9),
        0 0 150px rgba(251, 191, 36, 0.3);
    }

    .wheel::before {
      content: '';
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      bottom: 20px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        #ff6b35 0deg 4.86deg,
        #f7931e 4.86deg 9.73deg,
        #fbbf24 9.73deg 14.59deg,
        #fef08a 14.59deg 19.46deg,
        #34d399 19.46deg 24.32deg,
        #10b981 24.32deg 29.19deg,
        #059669 29.19deg 34.05deg,
        #047857 34.05deg 38.92deg,
        #06b6d4 38.92deg 43.78deg,
        #0891b2 43.78deg 48.65deg,
        #0e7490 48.65deg 53.51deg,
        #0c4a6e 53.51deg 58.38deg,
        #8b5cf6 58.38deg 63.24deg,
        #7c3aed 63.24deg 68.11deg,
        #6d28d9 68.11deg 72.97deg,
        #5b21b6 72.97deg 77.84deg,
        #ec4899 77.84deg 82.7deg,
        #db2777 82.7deg 87.57deg,
        #be185d 87.57deg 92.43deg,
        #9d174d 92.43deg 97.3deg,
        #f87171 97.3deg 102.16deg,
        #ef4444 102.16deg 107.03deg,
        #dc2626 107.03deg 111.89deg,
        #b91c1c 111.89deg 116.76deg
      );
      mask: radial-gradient(circle closest-side, transparent 70%, black 71%);
      animation: wheelShine 10s linear infinite;
    }

    @keyframes wheelShine {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .segment {
      position: absolute;
      width: 55%;
      height: 4px;
      top: 50%;
      left: 50%;
      transform-origin: 0% 50%;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    }

    .segment-label {
      position: absolute;
      right: -22px;
      top: -14px;
      width: 40px;
      text-align: center;
      font-size: clamp(9px, 1.6vw, 11px);
      font-weight: 800;
      color: #fefefe;
      transform-origin: 50% 50%;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }

    .center-hub {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90px;
      height: 90px;
      background: radial-gradient(circle, #fbbf24 0%, #f59e0b 60%, #d97706 100%);
      border-radius: 50%;
      border: 8px solid #fef08a;
      box-shadow: 
        0 0 30px rgba(251, 191, 36, 0.8),
        inset 0 0 20px rgba(255, 255, 255, 0.3);
      z-index: 12;
      animation: hubPulse 2s ease-in-out infinite alternate;
    }

    @keyframes hubPulse {
      0% { box-shadow: 0 0 30px rgba(251, 191, 36, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.3); }
      100% { box-shadow: 0 0 45px rgba(251, 191, 36, 1), inset 0 0 30px rgba(255, 255, 255, 0.5); }
    }

    /* 其他樣式保持原樣... */
    .controls {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
      z-index: 10;
    }

    button {
      padding: 16px 32px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: #f9fafb;
      cursor: pointer;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s;
    }

    button:hover::before {
      left: 100%;
    }

    button:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 12px 35px rgba(59, 130, 246, 0.6);
    }

    button:active {
      transform: translateY(-2px) scale(1.02);
    }

    button:disabled {
      background: linear-gradient(135deg, #4b5563, #374151);
      cursor: default;
      transform: none;
      box-shadow: 0 4px 12px rgba(75, 85, 99, 0.3);
    }

    .round {
      font-size: 1.3rem;
      opacity: 0.95;
      margin-bottom: 12px;
      min-height: 28px;
      text-align: center;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .result {
      min-height: 100px;
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 900;
      margin-top: 12px;
      text-align: center;
      line-height: 1;
      text-shadow: 
        0 0 20px currentColor,
        0 4px 16px rgba(0,0,0,0.9);
      background: linear-gradient(135deg, rgba(249, 250, 251, 0.15), rgba(249, 250, 251, 0.05));
      padding: 24px 32px;
      border-radius: 24px;
      border: 3px solid rgba(249, 250, 251, 0.3);
      backdrop-filter: blur(20px);
      box-shadow: 
        0 20px 60px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.2);
      animation: resultPop 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    @keyframes resultPop {
      0% { transform: scale(0.3) rotateX(90deg); opacity: 0; }
      50% { transform: scale(1.05); }
      100% { transform: scale(1) rotateX(0); opacity: 1; }
    }

    .names-panel {
      width: 340px;
      max-height: 580px;
      display: flex;
      flex-direction: column;
      background: rgba(17, 24, 39, 0.95);
      border-radius: 24px;
      border: 2px solid rgba(31, 41, 55, 0.8);
      box-shadow: 
        0 30px 80px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.1);
      overflow: hidden;
      backdrop-filter: blur(20px);
    }

    .names-header {
      padding: 16px 20px;
      border-bottom: 2px solid rgba(31, 41, 55, 0.8);
      font-size: 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, rgba(11, 17, 32, 0.95), rgba(17, 24, 39, 0.8));
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

      list
