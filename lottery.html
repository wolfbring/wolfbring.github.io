<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>課堂點名 1–60 旋轉輪盤（含姓名）</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
      color: #f9fafb;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      display: flex;
      gap: 24px;
      padding: 24px 32px;
    }

    h1 {
      margin: 0 0 4px 0;
    }

    .hint {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 12px;
      text-align: left;
    }

    .wheel-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wheel-container {
      position: relative;
      width: 360px;
      height: 360px;
      margin-bottom: 16px;
    }

    .pointer {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-bottom: 22px solid #f97316;
      z-index: 10;
      filter: drop-shadow(0 0 4px rgba(0,0,0,0.6));
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #1e293b, #020617);
      border: 6px solid #0f172a;
      position: relative;
      overflow: hidden;
      transition: transform 4s cubic-bezier(0.17, 0.89, 0.24, 1.1);
      box-shadow:
        0 0 0 4px #111827,
        0 18px 35px rgba(0,0,0,0.6);
    }

    .segment {
      position: absolute;
      width: 50%;
      height: 2px;
      top: 50%;
      left: 50%;
      transform-origin: 0% 50%;
    }

    .segment-label {
      position: absolute;
      right: -18px;
      top: -10px;
      width: 32px;
      text-align: center;
      font-size: 11px;
      color: #e5e7eb;
      transform-origin: 50% 50%;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 4px;
    }

    button {
      padding: 8px 18px;
      border-radius: 999px;
      border: none;
      background: #3b82f6;
      color: #f9fafb;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #2563eb;
    }

    button:active {
      background: #1d4ed8;
      transform: translateY(1px);
    }

    button:disabled {
      background: #4b5563;
      cursor: default;
    }

    .round {
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 4px;
      min-height: 18px;
      text-align: center;
    }

    .result {
      min-height: 24px;
      font-size: 18px;
      margin-top: 2px;
      text-align: center;
    }

    .names-panel {
      width: 240px;
      max-height: 420px;
      display: flex;
      flex-direction: column;
      background: #020617;
      border-radius: 12px;
      border: 1px solid #1f2933;
      box-shadow: 0 14px 30px rgba(0,0,0,0.45);
      overflow: hidden;
    }

    .names-header {
      padding: 8px 12px;
      border-bottom: 1px solid #1f2933;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0b1120;
    }

    .names-header span {
      opacity: 0.9;
    }

    .names-list {
      list-style: none;
      margin: 0;
      padding: 4px 0;
      overflow-y: auto;
    }

    .names-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 10px;
      font-size: 14px;
      border-bottom: 1px solid rgba(15,23,42,0.7);
      background: transparent;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .names-list li:nth-child(2n) {
      background: rgba(15,23,42,0.7);
    }

    .names-list li .no {
      opacity: 0.8;
      width: 40px;
    }

    .names-list li .nm {
      flex: 1;
    }

    .names-list li.active {
      background: #f59e0b;
      color: #111827;
      font-weight: 600;
    }

    .names-list li.active .no {
      opacity: 1;
    }

    .names-footer {
      padding: 4px 10px 6px 10px;
      font-size: 12px;
      opacity: 0.8;
      text-align: right;
      background: #020617;
    }

    @media (max-width: 800px) {
      .app {
        flex-direction: column;
        align-items: center;
      }
      .names-panel {
        width: 320px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="wheel-panel">
      <h1>課堂點名數字輪盤</h1>
      <div class="hint">
        點「旋轉」抽出座號，右側同步顯示姓名。<br>
        修改程式碼中的 <code>students</code> 陣列即可換班級名單。
      </div>

      <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel" id="wheel"></div>
      </div>

      <div class="controls">
        <button id="spinBtn">旋轉</button>
        <button id="resetBtn">重置</button>
      </div>
      <div class="round" id="roundInfo"></div>
      <div class="result" id="result"></div>
    </div>

    <div class="names-panel">
      <div class="names-header">
        <span>座號與姓名</span>
        <span id="countInfo"></span>
      </div>
      <ul class="names-list" id="namesList"></ul>
      <div class="names-footer" id="namesFooter"></div>
    </div>
  </div>

  <script>
    // 1. 名單（按座號順序）
    const students = [
      "學生01", "學生02", "學生03", "學生04", "學生05",
      "學生06", "學生07", "學生08", "學生09", "學生10",
      "學生11", "學生12", "學生13", "學生14", "學生15",
      "學生16", "學生17", "學生18", "學生19", "學生20",
      "學生21", "學生22", "學生23", "學生24", "學生25",
      "學生26", "學生27", "學生28", "學生29", "學生30",
      "學生31", "學生32", "學生33", "學生34", "學生35",
      "學生36", "學生37", "學生38", "學生39", "學生40",
      "學生41", "學生42", "學生43", "學生44", "學生45",
      "學生46", "學生47", "學生48", "學生49", "學生50",
      "學生51", "學生52", "學生53", "學生54", "學生55",
      "學生56", "學生57", "學生58", "學生59", "學生60"
    ];

    const COUNT = students.length;
    const RECENT_LIMIT = 5;

    const wheel = document.getElementById('wheel');
    const spinBtn = document.getElementById('spinBtn');
    const resetBtn = document.getElementById('resetBtn');
    const result = document.getElementById('result');
    const roundInfo = document.getElementById('roundInfo');

    const namesList = document.getElementById('namesList');
    const countInfo = document.getElementById('countInfo');
    const namesFooter = document.getElementById('namesFooter');

    const anglePer = 360 / COUNT;

    // 2. 產生圓周數字
    for (let i = 0; i < COUNT; i++) {
      const segment = document.createElement('div');
      segment.className = 'segment';
      segment.style.transform = `rotate(${i * anglePer}deg)`;

      const label = document.createElement('div');
      label.className = 'segment-label';
      label.textContent = i + 1;

      const hue = (i * 6) % 360;
      label.style.color = `hsl(${hue}, 80%, 70%)`;

      segment.appendChild(label);
      wheel.appendChild(segment);
    }

    // 3. 右側名單
    countInfo.textContent = `共 ${COUNT} 人`;
    students.forEach((name, index) => {
      const li = document.createElement('li');
      li.dataset.no = index + 1;

      const noSpan = document.createElement('span');
      noSpan.className = 'no';
      noSpan.textContent = String(index + 1).padStart(2, '0');

      const nameSpan = document.createElement('span');
      nameSpan.className = 'nm';
      nameSpan.textContent = name || '(未填姓名)';

      li.appendChild(noSpan);
      li.appendChild(nameSpan);
      namesList.appendChild(li);
    });
    namesFooter.textContent = '提示：點名前先確認座號與姓名對應。';

    let currentRotation = 0;
    let isSpinning = false;
    let round = 0;
    const recent = [];

    function drawNonRepeating() {
      let n;
      let tries = 0;
      do {
        n = Math.floor(Math.random() * COUNT) + 1;
        tries++;
        if (tries > 30) break;
      } while (recent.includes(n));

      recent.push(n);
      if (recent.length > RECENT_LIMIT) {
        recent.shift();
      }
      return n;
    }

    function highlightName(no) {
      const items = namesList.querySelectorAll('li');
      items.forEach(li => {
        li.classList.toggle('active', Number(li.dataset.no) === no);
      });
    }

    function spin() {
      if (isSpinning) return;
      isSpinning = true;
      spinBtn.disabled = true;
      result.textContent = '轉動中…';

      const chosen = drawNonRepeating();
      const chosenName = students[chosen - 1] || '(未填姓名)';

      const extraTurns = 5 + Math.floor(Math.random() * 5);
      const targetDeg =
        extraTurns * 360 +
        (90 - anglePer * (chosen - 1));

      currentRotation = targetDeg;
      wheel.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        isSpinning = false;
        spinBtn.disabled = false;
        round++;
        roundInfo.textContent = `第 ${round} 輪`;
        result.textContent = `抽到：${chosen} 號　${chosenName}`;
        highlightName(chosen);
      }, 4200);
    }

    function resetAll() {
      if (isSpinning) return;
      currentRotation = 0;
      wheel.style.transform = 'rotate(0deg)';
      round = 0;
      recent.length = 0;
      roundInfo.textContent = '';
      result.textContent = '';
      highlightName(-1);
    }

    // 4. 綁定按鈕事件
    spinBtn.addEventListener('click', spin);
    resetBtn.addEventListener('click', resetAll);
  </script>
</body>
</html>
