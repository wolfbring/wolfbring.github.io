
<style>
  .quiz-wrap { padding: 1.5rem 0; max-width: 640px; margin: 0 auto; }
  .progress-bar-bg { height: 4px; background: var(--color-border-tertiary); border-radius: 2px; margin-bottom: 2rem; }
  .progress-bar-fill { height: 4px; background: var(--color-text-secondary); border-radius: 2px; transition: width 0.4s ease; }
  .q-num { font-size: 12px; color: var(--color-text-tertiary); margin-bottom: 0.5rem; }
  .q-text { font-size: 17px; font-weight: 500; color: var(--color-text-primary); line-height: 1.6; margin-bottom: 2rem; }
  .btn-row { display: flex; gap: 12px; }
  .btn-ans { flex: 1; padding: 14px; border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); font-size: 15px; font-weight: 500; color: var(--color-text-primary); cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; }
  .btn-ans:hover { background: var(--color-background-secondary); }
  .btn-ans:active { transform: scale(0.97); }
  .btn-ans.sel-yes { background: #E6F1FB; border-color: #378ADD; color: #0C447C; }
  .btn-ans.sel-no { background: #F1EFE8; border-color: #888780; color: #2C2C2A; }
  .nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; }
  .btn-nav { background: none; border: none; font-size: 13px; color: var(--color-text-tertiary); cursor: pointer; padding: 4px 0; }
  .btn-nav:hover { color: var(--color-text-secondary); }
  .btn-submit { flex: 1; padding: 14px; border-radius: var(--border-radius-lg); border: 0.5px solid #378ADD; background: #E6F1FB; font-size: 15px; font-weight: 500; color: #0C447C; cursor: pointer; margin-top: 1.5rem; width: 100%; }
  .btn-submit:hover { background: #B5D4F4; }
  .result-section { text-align: center; padding: 1rem 0; }
  .score-ring { width: 120px; height: 120px; margin: 0 auto 1rem; position: relative; }
  .score-ring svg { width: 120px; height: 120px; }
  .score-num { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 32px; font-weight: 500; color: var(--color-text-primary); }
  .result-title { font-size: 22px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 0.75rem; }
  .result-desc { font-size: 15px; color: var(--color-text-secondary); line-height: 1.7; margin-bottom: 2rem; text-align: left; }
  .badge { display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 99px; margin-bottom: 1rem; }
  .meter-row { display: flex; align-items: center; gap: 12px; margin-bottom: 1rem; }
  .meter-label { font-size: 13px; color: var(--color-text-tertiary); width: 72px; text-align: right; }
  .meter-bg { flex: 1; height: 8px; background: var(--color-border-tertiary); border-radius: 4px; overflow: hidden; }
  .meter-fill { height: 8px; border-radius: 4px; }
  .btn-restart { border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); border-radius: var(--border-radius-md); padding: 10px 24px; font-size: 14px; color: var(--color-text-secondary); cursor: pointer; margin-top: 0.5rem; }
  .btn-restart:hover { background: var(--color-background-secondary); }
</style>

<div class="quiz-wrap">
  <h2 class="sr-only">i銝誨?曉?皜祇?嚗15憿??嚗???憿舐內???隞?摰?/h2>
  <div id="app"></div>
</div>

<script>
const Q = [
  { text: "?24撠??改?雿?西撠鈭?撠??冽?璈??唾??荔?", yesPoint: true },
  { text: "雿??箸??璈??冗蝢方?擃董??嚗?, yesPoint: true },
  { text: "雿??箄撌望???縑隞啁?鈭箏?嚗?, yesPoint: false },
  { text: "雿遛17甇脫?撌脩???擏??", yesPoint: false },
  { text: "雿??箏??批?憪餅?閰脣?瘜?嚗?, yesPoint: true },
  { text: "雿遛16甇脫????恍?蝎暸ㄡ??嚗??嗾???蝞?嚗?, yesPoint: false },
  { text: "雿??撟湔??虜?慦賢?嗅?嚗?, yesPoint: false },
  { text: "雿?銝剖飛??摮豢鋆∠車???臬?雿???鈭箸?西?????銝嚗?, yesPoint: true },
  { text: "雿?銝剖飛??瘥望???臬?質????勗漲嚗?, yesPoint: false },
  { text: "雿?銝剖飛?????摮豢???撌伐?", yesPoint: false },
  { text: "雿?血??犖?????刻??Ｗ???霅衣內?臬末銝餅?嚗蒂???見?賣?雿?蝬????荔?", yesPoint: true },
  { text: "雿?踵祥銝?函?瘣曉?嚗?, yesPoint: true },
  { text: "雿?行?之暻餃?瘜?嚗?, yesPoint: true },
  { text: "餈賣?銝????扳?瘝?憿?嚗?, yesPoint: true },
  { text: "雿?銝剖飛???臬蝬虜?死鋡怠蕭?乩蒂閬箏?撖?嚗?, yesPoint: true },
];

const RESULTS = [
  { min: 0,  max: 3,  label: "?喟絞銝誨",     fill: "#888780", bg: "#D3D1C7", desc: "雿??暑?孵???潸??蝯曹?隞??摨阡??????Ｗ??Ｖ??蝯梁?靽?隞亙?閬芾澈擃???瘣颯雿???雿??芣撌亙嚗??舐??賜??詨??? },
  { min: 4,  max: 7,  label: "頝其?隞??皜∪?", fill: "#378ADD", bg: "#B5D4F4", desc: "雿????蝯梯??曆誨?鞈芥??賡?瘣餃?冽雿??曉祕銝?銋???嚗?賭澈???撣嗡??噶?抬?銋?憭勗鈭箄?鈭箔???撖衣?????? },
  { min: 8,  max: 11, label: "?亥?i銝誨",    fill: "#1D9E75", bg: "#9FE1CB", desc: "雿?閮勗?銵??摨血歇?貊鞎潸?i銝誨??蝧?冽?璈???憭?霅圈????暹?摨佗?銝虫??冽雿憓葉?芸?暑?? },
  { min: 12, max: 15, label: "?詨?i銝誨",    fill: "#7F77DD", bg: "#CECBF6", desc: "雿?撣詨??i銝誨嚗?批???撟曆??臭??辣隡賂?蝷曄黎慦??臭??冗鈭文??雿??犖?芰???像蝑?撘瑞?隤?嚗????航???唳雿?隞?葆靘?摮斤?? },
];

var answers = new Array(15).fill(null);
var current = 0;
var showResult = false;

function calcScore() {
  var s = 0;
  for (var i = 0; i < 15; i++) {
    if (answers[i] === null) continue;
    if (Q[i].yesPoint && answers[i] === 'yes') s++;
    if (!Q[i].yesPoint && answers[i] === 'no') s++;
  }
  return s;
}

function getResult(score) {
  for (var i = 0; i < RESULTS.length; i++) {
    if (score >= RESULTS[i].min && score <= RESULTS[i].max) return RESULTS[i];
  }
  return RESULTS[3];
}

function render() {
  var app = document.getElementById('app');
  if (showResult) {
    renderResult(app);
  } else {
    renderQuestion(app);
  }
}

function renderQuestion(app) {
  var answered = answers.filter(function(a){ return a !== null; }).length;
  var pct = (answered / 15) * 100;
  var q = Q[current];
  var selYes = answers[current] === 'yes' ? 'sel-yes' : '';
  var selNo  = answers[current] === 'no'  ? 'sel-no'  : '';
  var isLast = current === 14;
  var canSubmit = isLast && answers[current] !== null;

  var submitBtn = canSubmit
    ? '<button class="btn-submit" onclick="submitQuiz()">?亦?蝯?</button>'
    : '';

  var nextBtn = (!isLast && answers[current] !== null)
    ? '<button class="btn-nav" onclick="go(' + (current+1) + ')">銝?憿???/button>'
    : '<span></span>';

  app.innerHTML =
    '<div class="progress-bar-bg"><div class="progress-bar-fill" style="width:' + pct + '%"></div></div>' +
    '<p class="q-num">蝚?' + (current+1) + ' 憿???15 憿?/p>' +
    '<p class="q-text">' + q.text + '</p>' +
    '<div class="btn-row">' +
      '<button class="btn-ans ' + selYes + '" onclick="pick(\'yes\')">??/button>' +
      '<button class="btn-ans ' + selNo  + '" onclick="pick(\'no\')">??/button>' +
    '</div>' +
    submitBtn +
    '<div class="nav-row">' +
      (current > 0 ? '<button class="btn-nav" onclick="go(' + (current-1) + ')">??銝?憿?/button>' : '<span></span>') +
      nextBtn +
    '</div>';
}

function pick(val) {
  answers[current] = val;
  if (current < 14) {
    current++;
    render();
  } else {
    render();
  }
}

function go(idx) {
  current = idx;
  render();
}

function submitQuiz() {
  showResult = true;
  render();
}

function renderResult(app) {
  var score = calcScore();
  var r = getResult(score);
  var circumference = 2 * Math.PI * 50;
  var dash = (score / 15) * circumference;
  var offset = circumference * 0.25;

  var meters = RESULTS.map(function(res) {
    var active = score >= res.min && score <= res.max;
    var w = active ? Math.round(((score - res.min) / (res.max - res.min + 1)) * 100) : (score > res.max ? 100 : 5);
    return '<div class="meter-row">' +
      '<span class="meter-label">' + res.label + '</span>' +
      '<div class="meter-bg"><div class="meter-fill" style="width:' + w + '%;background:' + res.fill + ';"></div></div>' +
      '<span style="font-size:12px;color:var(--color-text-tertiary);">' + res.min + '?? + res.max + '</span>' +
    '</div>';
  }).join('');

  app.innerHTML =
    '<div class="result-section">' +
      '<div class="score-ring">' +
        '<svg viewBox="0 0 120 120">' +
          '<circle cx="60" cy="60" r="50" fill="none" stroke="var(--color-border-tertiary)" stroke-width="8"/>' +
          '<circle cx="60" cy="60" r="50" fill="none" stroke="' + r.fill + '" stroke-width="8" ' +
            'stroke-dasharray="' + dash + ' ' + circumference + '" ' +
            'stroke-dashoffset="' + offset + '" stroke-linecap="round"/>' +
        '</svg>' +
        '<div class="score-num">' + score + '</div>' +
      '</div>' +
      '<p style="font-size:12px;color:var(--color-text-tertiary);margin-bottom:1rem;">皛踹? 15 ??/p>' +
      '<div class="badge" style="background:' + r.bg + ';color:' + r.fill + ';">' + r.label + '</div>' +
      '<p class="result-title">' + r.label + '</p>' +
      '<p class="result-desc">' + r.desc + '</p>' +
      '<div style="text-align:left;margin-bottom:2rem;">' +
        '<p style="font-size:13px;color:var(--color-text-tertiary);margin-bottom:1rem;">??隞?????/p>' +
        meters +
      '</div>' +
      '<button class="btn-restart" onclick="restart()">?皜祇?</button>' +
    '</div>';
}

function restart() {
  answers = new Array(15).fill(null);
  current = 0;
  showResult = false;
  render();
}

render();
</script>
